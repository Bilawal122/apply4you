name: Worker watchdog

# The worker is a separate always-on service, and the failure that matters is
# silent: Redis stays up, the web app keeps accepting queue clicks, and
# applications simply never fill. /api/health/queue is deliberately public and
# returns 503 unless Redis answers AND a worker heartbeat is fresh, so polling
# it from here is a complete liveness check needing no secrets.
#
# A failing scheduled workflow emails the repo owner by default — that is the
# alert. Set the repository variable APP_URL (Settings → Secrets and variables
# → Actions → Variables) to the production origin, e.g.
# https://apply4you-web-one.vercel.app
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: queue + worker liveness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll /api/health/queue
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not set — cannot check the worker."
            exit 1
          fi
          url="${APP_URL%/}/api/health/queue"

          # One retry: a single cold start or blip should not page anyone.
          for attempt in 1 2; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$url" || echo $'\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            if [ "$code" = "200" ]; then
              echo "healthy: $payload"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            echo "$payload"
            [ $attempt -eq 1 ] && sleep 30
          done

          echo "::error::Worker/queue unhealthy (HTTP $code). 'no-consumer' means Redis is reachable but no worker is processing — check the Railway service."
          exit 1

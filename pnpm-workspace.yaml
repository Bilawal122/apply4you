packages:
  - "apps/*"
  - "packages/*"

# Moved here from package.json's "pnpm" field: pnpm 10.33 stopped reading that
# field and silently ignored both settings. https://pnpm.io/settings
overrides:
  ioredis: ^5.11.1

onlyBuiltDependencies:
  - esbuild
  - sharp
  - msgpackr-extract
  - protobufjs
  - unrs-resolver
